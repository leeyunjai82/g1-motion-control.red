<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unitree G1 | Motion Editor</title>
<!-- Version: 7.0 — simulator.html(관절 v5.2) + simulator_ik.html(IK v6.3) 통합
  - 좌측 패널 Joint/IK 모드 토글, 이동·손·타임라인 공용
  - 타임라인에 관절/IK 프레임 혼재 가능 (백엔드 /set_motion 이 프레임별 판별)
  - EMERGENCY STOP = 동결(freeze), 홈 복귀는 별도 버튼(/go_home) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary:#0D1117; --bg-secondary:#161B22; --bg-tertiary:#21262D;
  --border-primary:#30363D; --text-primary:#C9D1D9; --text-secondary:#8B949E;
  --accent-primary:#58A6FF; --accent-danger:#F85149; --accent-hand:#F778BA;
  --accent-waist:#F0A050; --accent-ik:#3FB950; --accent-rot:#D2A8FF;
  --font-sans:'Noto Sans KR',sans-serif; --font-mono:'Roboto Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box}
html{font-size:13.5px}
body{font-family:var(--font-sans);background:var(--bg-primary);color:var(--text-primary);margin:0;overflow:hidden}
.app-container{display:grid;grid-template-columns:1.8fr 1fr 1.5fr;grid-template-rows:auto 1fr;
  grid-template-areas:"header header header" "arm-panel controls-panel editor-panel";
  height:100vh;padding:1rem;gap:1rem}
.app-header{grid-area:header;display:flex;justify-content:space-between;align-items:center;
  padding-bottom:.8rem;border-bottom:1px solid var(--border-primary)}
.app-title{font-size:1.4rem;font-weight:500;margin:0}
.app-title span{font-weight:300;color:var(--text-secondary)}
.header-status{display:flex;gap:.8rem;align-items:center}
.hand-status{font-size:.8rem;color:var(--text-secondary);padding:.3rem .6rem;
  background:var(--bg-secondary);border:1px solid var(--border-primary);border-radius:.4rem}
.hand-status.connected{color:var(--accent-hand);border-color:var(--accent-hand)}
#home-button{background:var(--bg-secondary);color:var(--accent-primary);border:1px solid var(--accent-primary);
  padding:.5rem 1rem;border-radius:.4rem;cursor:pointer;font-weight:500;font-size:.85rem}
#home-button:hover{background:var(--accent-primary);color:var(--bg-primary)}
#reset-all-button{background:var(--bg-secondary);color:var(--accent-danger);border:1px solid var(--accent-danger);
  padding:.5rem 1rem;border-radius:.4rem;cursor:pointer;font-weight:500;font-size:.85rem}
#reset-all-button:hover{background:var(--accent-danger);color:var(--bg-primary)}

/* 모드 토글 */
.mode-toggle{display:flex;background:var(--bg-secondary);border:1px solid var(--border-primary);border-radius:.5rem;overflow:hidden}
.mode-toggle button{padding:.5rem 1.4rem;background:transparent;border:none;color:var(--text-secondary);
  font:inherit;font-size:.9rem;font-weight:500;cursor:pointer}
.mode-toggle button.active{background:var(--bg-tertiary);color:var(--accent-primary)}
.mode-toggle button.active.ik{color:var(--accent-ik)}

.panel{background:var(--bg-secondary);border:1px solid var(--border-primary);border-radius:.6rem;
  display:flex;flex-direction:column;min-height:0;padding:1.2rem;overflow-y:auto}
#arm-panel{grid-area:arm-panel}
#controls-panel{grid-area:controls-panel}
#motion-editor-panel{grid-area:editor-panel}
.panel-title{margin:0 0 1rem;font-size:1rem;font-weight:500}

/* ---- Joint 모드 ---- */
#arm-grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem 2rem}
#waist-section{margin-top:1rem;padding-top:.8rem;border-top:1px solid var(--border-primary)}
#WAIST_CONTROLS{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem}
.joint-group-title{font-size:.95rem;font-weight:500;margin:0 0 .6rem;color:var(--accent-primary)}
.joint-group-title.waist-title{color:var(--accent-waist)}
.control-item{margin-bottom:.45rem}
.label-wrapper{display:flex;justify-content:space-between;font-size:.75rem;margin-bottom:.15rem}
.label-name{color:var(--text-primary)}
.motor-id{color:var(--text-secondary);font-family:var(--font-mono);font-size:.7rem}
.input-wrapper{display:flex;gap:.5rem;align-items:center}
.input-wrapper input[type=range]{flex:1;accent-color:var(--accent-primary)}
.input-wrapper input[type=number]{width:4.2rem;background:var(--bg-primary);border:1px solid var(--border-primary);
  color:var(--text-primary);border-radius:.3rem;padding:.2rem .3rem;font-family:var(--font-mono);font-size:.75rem}
#WAIST_CONTROLS .input-wrapper input[type=range]{accent-color:var(--accent-waist)}

/* ---- IK 모드 ---- */
#ik-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.ik-arm-group{background:var(--bg-primary);border:1px solid var(--border-primary);border-radius:.5rem;padding:.8rem}
.ik-arm-title{font-size:.9rem;font-weight:500;color:var(--accent-ik);margin-bottom:.6rem}
.ik-control{margin-bottom:.4rem}
.label-row{display:flex;justify-content:space-between;font-size:.75rem;margin-bottom:.1rem}
.label-row .rot{color:var(--accent-rot)}
.label-value{font-family:var(--font-mono);color:var(--text-secondary);font-size:.72rem}
.input-row{display:flex;gap:.5rem;align-items:center}
.input-row input[type=range]{flex:1;accent-color:var(--accent-ik)}
.input-row input[type=range].rot-slider{accent-color:var(--accent-rot)}
.input-row input[type=number]{width:4.2rem;background:var(--bg-secondary);border:1px solid var(--border-primary);
  color:var(--text-primary);border-radius:.3rem;padding:.2rem .3rem;font-family:var(--font-mono);font-size:.72rem}
.rot-controls{margin-top:.5rem;padding-top:.4rem;border-top:1px dashed var(--border-primary)}
.rot-label{font-size:.72rem;color:var(--accent-rot);margin-bottom:.3rem}

/* ---- 이동/손 ---- */
.section-title{font-size:.95rem;font-weight:500;margin:0 0 .6rem;text-align:center}
#locomotion-controls{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin-bottom:1rem}
.loco-btn{aspect-ratio:1.6;background:var(--bg-tertiary);border:1px solid var(--border-primary);color:var(--text-primary);
  border-radius:.4rem;font-size:1.1rem;cursor:pointer}
.loco-btn:hover{border-color:var(--accent-primary)}
#loco-forward{grid-column:2}
#loco-stop{color:var(--accent-danger)}
#loco-backward{grid-column:2}
.hand-controls-container{margin-top:.5rem;padding-top:.8rem;border-top:1px solid var(--border-primary)}
.hand-selector{display:flex;gap:.4rem;margin-bottom:.6rem}
.hand-selector button{flex:1;padding:.4rem;background:var(--bg-tertiary);border:1px solid var(--border-primary);
  color:var(--text-secondary);border-radius:.4rem;cursor:pointer;font-size:.8rem}
.hand-selector button.active{color:var(--accent-hand);border-color:var(--accent-hand)}
.hand-motions-grid{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-bottom:.6rem}
.hand-motion-btn{padding:.45rem .3rem;background:var(--bg-tertiary);border:1px solid var(--border-primary);
  color:var(--text-primary);border-radius:.4rem;cursor:pointer;font-size:.75rem}
.hand-motion-btn.active{border-color:var(--accent-hand);color:var(--accent-hand)}
#hand-release-btn{width:100%;padding:.5rem;background:var(--bg-tertiary);border:1px solid var(--accent-hand);
  color:var(--accent-hand);border-radius:.4rem;cursor:pointer;font-size:.8rem}

/* ---- 타임라인 ---- */
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem .8rem;margin-bottom:.8rem}
.settings-grid label{display:block;font-size:.72rem;color:var(--text-secondary);margin-bottom:.2rem}
.settings-grid input[type=number],.settings-grid select{width:100%;background:var(--bg-primary);
  border:1px solid var(--border-primary);color:var(--text-primary);border-radius:.3rem;padding:.35rem .4rem;font-size:.8rem}
.checkbox-item{display:flex;align-items:center;gap:.4rem;padding:.35rem 0}
.checkbox-item label{margin:0;font-size:.78rem;color:var(--text-primary)}
#timeline-container{flex:1;overflow-y:auto;border:1px solid var(--border-primary);border-radius:.4rem;margin:.6rem 0;min-height:0}
#timeline-table{width:100%;border-collapse:collapse}
#timeline-table th,#timeline-table td{border-bottom:1px solid var(--border-primary);padding:.5rem .6rem;text-align:left;font-size:.8rem}
#timeline-table th{background:var(--bg-tertiary);color:var(--text-secondary);position:sticky;top:0}
#timeline-table tbody tr{cursor:pointer}
#timeline-table tbody tr:hover{background:var(--bg-tertiary)}
.frame-type{font-family:var(--font-mono);font-size:.68rem;padding:.1rem .35rem;border-radius:.3rem}
.frame-type.joint{color:var(--accent-primary);border:1px solid var(--accent-primary)}
.frame-type.ik{color:var(--accent-ik);border:1px solid var(--accent-ik)}
.frame-detail{font-family:var(--font-mono);font-size:.65rem;color:var(--text-secondary)}
.delete-frame-btn{background:transparent;border:none;color:var(--text-secondary);cursor:pointer;font-size:1.1rem}
.delete-frame-btn:hover{color:var(--accent-danger)}
.btn{background:var(--bg-tertiary);border:1px solid var(--border-primary);color:var(--text-primary);
  border-radius:.4rem;padding:.6rem;font-size:.85rem;font-weight:500;cursor:pointer}
.btn:hover{border-color:var(--text-primary)}
.btn-primary{background:var(--accent-primary);border-color:var(--accent-primary)}
.btn-group{display:flex;gap:.8rem}
.btn-group .btn{flex-grow:1}
</style>
</head>
<body>
<div class="app-container">
  <header class="app-header">
    <h1 class="app-title">G1 Motion Editor <span>v7.0</span></h1>
    <div class="mode-toggle">
      <button id="mode-joint" class="active">Joint · 관절</button>
      <button id="mode-ik">IK · 좌표</button>
    </div>
    <div class="header-status">
      <div id="hand-status" class="hand-status">손: 확인 중...</div>
      <button id="home-button">⌂ 홈 자세</button>
      <button id="reset-all-button">EMERGENCY STOP</button>
    </div>
  </header>

  <!-- 좌측: Joint / IK 전환 패널 -->
  <div id="arm-panel" class="panel">
    <div id="joint-mode-panel">
      <div id="arm-grid">
        <div><h4 class="joint-group-title">오른쪽 팔</h4><div id="R_ARM_CONTROLS"></div></div>
        <div><h4 class="joint-group-title">왼쪽 팔</h4><div id="L_ARM_CONTROLS"></div></div>
      </div>
      <div id="waist-section">
        <h4 class="joint-group-title waist-title">허리 (Waist)</h4>
        <div id="WAIST_CONTROLS"></div>
      </div>
    </div>

    <div id="ik-mode-panel" style="display:none">
      <div id="ik-grid">
        <div class="ik-arm-group">
          <div class="ik-arm-title">✋ 오른손</div>
          <div class="ik-control"><div class="label-row"><span class="label-name">X (전후)</span><span class="label-value" id="r-x-val">0.30</span></div>
            <div class="input-row"><input type="range" id="ik-r-x" min="0.1" max="0.5" value="0.3" step="0.01"><input type="number" id="ik-r-x-num" min="0.1" max="0.5" value="0.3" step="0.01"></div></div>
          <div class="ik-control"><div class="label-row"><span class="label-name">Y (좌우)</span><span class="label-value" id="r-y-val">-0.20</span></div>
            <div class="input-row"><input type="range" id="ik-r-y" min="-0.5" max="-0.05" value="-0.2" step="0.01"><input type="number" id="ik-r-y-num" min="-0.5" max="-0.05" value="-0.2" step="0.01"></div></div>
          <div class="ik-control"><div class="label-row"><span class="label-name">Z (상하)</span><span class="label-value" id="r-z-val">0.00</span></div>
            <div class="input-row"><input type="range" id="ik-r-z" min="-0.3" max="0.5" value="0.0" step="0.01"><input type="number" id="ik-r-z-num" min="-0.3" max="0.5" value="0.0" step="0.01"></div></div>
          <div class="rot-controls">
            <div class="rot-label">🔄 Rotation (deg)</div>
            <div class="ik-control"><div class="label-row"><span class="label-name rot">Roll</span><span class="label-value" id="r-roll-val">0</span></div>
              <div class="input-row"><input type="range" class="rot-slider" id="ik-r-roll" min="-180" max="180" value="0" step="1"><input type="number" id="ik-r-roll-num" min="-180" max="180" value="0" step="1"></div></div>
            <div class="ik-control"><div class="label-row"><span class="label-name rot">Pitch</span><span class="label-value" id="r-pitch-val">0</span></div>
              <div class="input-row"><input type="range" class="rot-slider" id="ik-r-pitch" min="-180" max="180" value="0" step="1"><input type="number" id="ik-r-pitch-num" min="-180" max="180" value="0" step="1"></div></div>
            <div class="ik-control"><div class="label-row"><span class="label-name rot">Yaw</span><span class="label-value" id="r-yaw-val">0</span></div>
              <div class="input-row"><input type="range" class="rot-slider" id="ik-r-yaw" min="-180" max="180" value="0" step="1"><input type="number" id="ik-r-yaw-num" min="-180" max="180" value="0" step="1"></div></div>
          </div>
        </div>

        <div class="ik-arm-group">
          <div class="ik-arm-title">🤚 왼손</div>
          <div class="ik-control"><div class="label-row"><span class="label-name">X (전후)</span><span class="label-value" id="l-x-val">0.30</span></div>
            <div class="input-row"><input type="range" id="ik-l-x" min="0.1" max="0.5" value="0.3" step="0.01"><input type="number" id="ik-l-x-num" min="0.1" max="0.5" value="0.3" step="0.01"></div></div>
          <div class="ik-control"><div class="label-row"><span class="label-name">Y (좌우)</span><span class="label-value" id="l-y-val">0.20</span></div>
            <div class="input-row"><input type="range" id="ik-l-y" min="0.05" max="0.5" value="0.2" step="0.01"><input type="number" id="ik-l-y-num" min="0.05" max="0.5" value="0.2" step="0.01"></div></div>
          <div class="ik-control"><div class="label-row"><span class="label-name">Z (상하)</span><span class="label-value" id="l-z-val">0.00</span></div>
            <div class="input-row"><input type="range" id="ik-l-z" min="-0.3" max="0.5" value="0.0" step="0.01"><input type="number" id="ik-l-z-num" min="-0.3" max="0.5" value="0.0" step="0.01"></div></div>
          <div class="rot-controls">
            <div class="rot-label">🔄 Rotation (deg)</div>
            <div class="ik-control"><div class="label-row"><span class="label-name rot">Roll</span><span class="label-value" id="l-roll-val">0</span></div>
              <div class="input-row"><input type="range" class="rot-slider" id="ik-l-roll" min="-180" max="180" value="0" step="1"><input type="number" id="ik-l-roll-num" min="-180" max="180" value="0" step="1"></div></div>
            <div class="ik-control"><div class="label-row"><span class="label-name rot">Pitch</span><span class="label-value" id="l-pitch-val">0</span></div>
              <div class="input-row"><input type="range" class="rot-slider" id="ik-l-pitch" min="-180" max="180" value="0" step="1"><input type="number" id="ik-l-pitch-num" min="-180" max="180" value="0" step="1"></div></div>
            <div class="ik-control"><div class="label-row"><span class="label-name rot">Yaw</span><span class="label-value" id="l-yaw-val">0</span></div>
              <div class="input-row"><input type="range" class="rot-slider" id="ik-l-yaw" min="-180" max="180" value="0" step="1"><input type="number" id="ik-l-yaw-num" min="-180" max="180" value="0" step="1"></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 중앙: 이동 + 손 (공용) -->
  <div id="controls-panel" class="panel">
    <h4 class="section-title" style="color:var(--accent-primary)">이동</h4>
    <div id="locomotion-controls">
      <button id="loco-forward" class="loco-btn">↑</button>
      <button id="loco-turn_left" class="loco-btn">↶</button>
      <button id="loco-left" class="loco-btn">←</button>
      <button id="loco-stop" class="loco-btn">■</button>
      <button id="loco-right" class="loco-btn">→</button>
      <button id="loco-turn_right" class="loco-btn">↷</button>
      <button id="loco-backward" class="loco-btn">↓</button>
    </div>
    <div class="hand-controls-container">
      <h4 class="section-title" style="color:var(--accent-hand)">손 제어</h4>
      <div class="hand-selector">
        <button id="hand-select-left">왼손</button>
        <button id="hand-select-both" class="active">양손</button>
        <button id="hand-select-right">오른손</button>
      </div>
      <div id="hand-motions-grid" class="hand-motions-grid">
        <div style="grid-column:1/-1;text-align:center;color:var(--text-secondary);font-size:.8rem;padding:1rem 0">서버 연결 대기 중...</div>
      </div>
      <button id="hand-release-btn">✋ 손 펴기 (unfold)</button>
    </div>
  </div>

  <!-- 우측: 타임라인 (공용, 관절/IK 프레임 혼재) -->
  <div id="motion-editor-panel" class="panel">
    <h3 class="panel-title">타임라인 에디터</h3>
    <div class="settings-grid">
      <div><label for="travel-time-input">프레임 시간 (초)</label>
        <input type="number" id="travel-time-input" value="1.0" min="0.1" step="0.1"></div>
      <div><label for="locomotion-command-select">이동 명령</label>
        <select id="locomotion-command-select">
          <option value="none">없음</option><option value="forward">전진</option><option value="backward">후진</option>
          <option value="left">좌측</option><option value="right">우측</option>
          <option value="turn_left">좌회전</option><option value="turn_right">우회전</option><option value="stop">정지</option>
        </select></div>
      <div><label for="hand-motion-select">손 모션</label>
        <select id="hand-motion-select"><option value="none">없음</option></select></div>
      <div><label for="hand-target-select">손 선택</label>
        <select id="hand-target-select">
          <option value="both">양손</option><option value="left">왼손</option><option value="right">오른손</option>
        </select></div>
      <div><label>현재 자세 저장</label>
        <div class="checkbox-item"><input type="checkbox" id="save-pose-checkbox" checked>
          <label for="save-pose-checkbox" id="save-pose-label">포함 (현재 모드 기준)</label></div></div>
      <div><label>안전 모드 (Joint)</label>
        <div class="checkbox-item"><input type="checkbox" id="safe-mode-checkbox" checked>
          <label for="safe-mode-checkbox">x0.5 제한</label></div></div>
    </div>
    <div class="btn-group"><button id="add-frame-btn" class="btn">프레임 추가</button></div>
    <div id="timeline-container">
      <table id="timeline-table">
        <thead><tr><th>#</th><th>유형</th><th>내용</th><th>시간</th><th></th></tr></thead>
        <tbody id="timeline-table-body"></tbody>
      </table>
    </div>
    <div class="btn-group">
      <button id="play-motion-btn" class="btn btn-primary">재생</button>
      <button id="stop-motion-btn" class="btn" style="display:none;background:var(--accent-danger)">정지</button>
      <button id="save-motion-btn" class="btn">저장</button>
      <button id="load-motion-btn" class="btn">불러오기</button>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const API_BASE = `http://${location.hostname}:8000`;
  const API = {
    MOTOR: `${API_BASE}/set_motor`, WAIST: `${API_BASE}/set_waist`,
    IK: `${API_BASE}/set_ik`, LOCO: `${API_BASE}/set_loco_motion`,
    MOTION: `${API_BASE}/set_motion`, STOP: `${API_BASE}/stop_motion`,
    HOME: `${API_BASE}/go_home`,
    HAND: `${API_BASE}/set_hand`, HAND_MOTIONS: `${API_BASE}/hand_motions`
  };

  // ==================== 공용 상태 ====================
  let editorMode = 'joint';          // 'joint' | 'ik'
  let motionFrames = [];
  let isPlaying = false;
  let selectedHand = 'both';
  let activeHandMotion = null;

  async function apiCall(url, data) {
    try {
      const res = await fetch(url, { method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data) });
      return res.ok ? await res.json() : null;
    } catch (e) { return null; }
  }
  async function apiGet(url) {
    try { const res = await fetch(url); return res.ok ? await res.json() : null; }
    catch (e) { return null; }
  }

  // ==================== 모드 토글 ====================
  function setMode(m) {
    editorMode = m;
    document.getElementById('mode-joint').classList.toggle('active', m === 'joint');
    document.getElementById('mode-ik').classList.toggle('active', m === 'ik');
    document.getElementById('mode-ik').classList.toggle('ik', m === 'ik');
    document.getElementById('joint-mode-panel').style.display = m === 'joint' ? '' : 'none';
    document.getElementById('ik-mode-panel').style.display = m === 'ik' ? '' : 'none';
    document.getElementById('save-pose-label').textContent =
      m === 'joint' ? '포함 (팔 + 허리)' : '포함 (XYZ + Rotation)';
  }
  document.getElementById('mode-joint').addEventListener('click', () => setMode('joint'));
  document.getElementById('mode-ik').addEventListener('click', () => setMode('ik'));

  // ==================== Joint 모드 ====================
  const G1Joint = {
    WaistYaw: 0, WaistRoll: 1, WaistPitch: 2,
    LeftShoulderPitch: 15, LeftShoulderRoll: 16, LeftShoulderYaw: 17, LeftElbow: 18,
    LeftWristRoll: 19, LeftWristPitch: 20, LeftWristYaw: 21,
    RightShoulderPitch: 22, RightShoulderRoll: 23, RightShoulderYaw: 24, RightElbow: 25,
    RightWristRoll: 26, RightWristPitch: 27, RightWristYaw: 28,
  };
  const JOINT_LIMITS = {
    0:[-45,45], 1:[-20,20], 2:[-30,30],
    15:[-177,153], 16:[-91,129], 17:[-150,150], 18:[-60,120],
    19:[-113,113], 20:[-92.5,92.5], 21:[-92.5,92.5],
    22:[-177,153], 23:[-129,91], 24:[-150,150], 25:[-60,120],
    26:[-113,113], 27:[-92.5,92.5], 28:[-92.5,92.5],
  };
  const CONTROL_GROUPS = {
    'R_ARM_CONTROLS': [['Shoulder Pitch',22],['Shoulder Roll',23],['Shoulder Yaw',24],['Elbow',25],
                       ['Wrist Roll',26],['Wrist Pitch',27],['Wrist Yaw',28]],
    'L_ARM_CONTROLS': [['Shoulder Pitch',15],['Shoulder Roll',16],['Shoulder Yaw',17],['Elbow',18],
                       ['Wrist Roll',19],['Wrist Pitch',20],['Wrist Yaw',21]],
    'WAIST_CONTROLS': [['Yaw (좌우)',0],['Roll (기울기)',1],['Pitch (숙임)',2]]
  };
  const WAIST_INDICES = new Set([0,1,2]);
  let originalLimits = JSON.parse(JSON.stringify(JOINT_LIMITS));
  let currentLimits = { ...JOINT_LIMITS };

  function getMotorValue(i) {
    const s = document.getElementById(`slider-${i}`);
    return s ? parseFloat(s.value) : 0;
  }
  function setMotorValue(i, v) {
    const s = document.getElementById(`slider-${i}`);
    const n = document.getElementById(`number-${i}`);
    if (s) s.value = v;
    if (n) n.value = v.toFixed(1);
  }
  function initJointControls() {
    Object.entries(CONTROL_GROUPS).forEach(([id, joints]) => {
      const panel = document.getElementById(id);
      if (!panel) return;
      panel.innerHTML = joints.map(([label, idx]) => {
        const [min, max] = currentLimits[idx];
        return `<div class="control-item">
          <div class="label-wrapper"><span class="label-name">${label}</span><span class="motor-id">ID:${idx}</span></div>
          <div class="input-wrapper">
            <input type="range" id="slider-${idx}" min="${min}" max="${max}" value="0" step="0.1">
            <input type="number" id="number-${idx}" min="${min}" max="${max}" value="0" step="0.1">
          </div></div>`;
      }).join('');
    });
  }
  let motorTimeout = {};
  document.getElementById('joint-mode-panel').addEventListener('input', e => {
    const m = e.target.id?.match(/^(slider|number)-(\d+)$/);
    if (!m) return;
    const [, type, idxStr] = m;
    const idx = parseInt(idxStr);
    const [min, max] = currentLimits[idx] || [-180, 180];
    let val = Math.max(min, Math.min(max, parseFloat(e.target.value) || 0));
    if (type === 'slider') document.getElementById(`number-${idx}`).value = val.toFixed(1);
    else document.getElementById(`slider-${idx}`).value = val;
    clearTimeout(motorTimeout[idx]);
    motorTimeout[idx] = setTimeout(() =>
      apiCall(API.MOTOR, { motor_index: idx, target_degree: val, duration: 0.5 }), 50);
  });
  function toggleSafeMode() {
    const safe = document.getElementById('safe-mode-checkbox').checked;
    Object.keys(originalLimits).forEach(i => {
      const [min, max] = originalLimits[i];
      currentLimits[i] = safe ? [min * 0.5, max * 0.5] : [min, max];
    });
    initJointControls();
  }

  // ==================== IK 모드 ====================
  function getIKValues() {
    return { left:  ['x','y','z'].map(a => parseFloat(document.getElementById(`ik-l-${a}`).value)),
             right: ['x','y','z'].map(a => parseFloat(document.getElementById(`ik-r-${a}`).value)) };
  }
  function getRPYValues() {
    return { left:  ['roll','pitch','yaw'].map(a => parseFloat(document.getElementById(`ik-l-${a}`).value)),
             right: ['roll','pitch','yaw'].map(a => parseFloat(document.getElementById(`ik-r-${a}`).value)) };
  }
  function setIKValues(left, right) {
    ['x','y','z'].forEach((axis, i) => {
      document.getElementById(`ik-l-${axis}`).value = left[i];
      document.getElementById(`ik-l-${axis}-num`).value = left[i].toFixed(2);
      document.getElementById(`l-${axis}-val`).textContent = left[i].toFixed(2);
      document.getElementById(`ik-r-${axis}`).value = right[i];
      document.getElementById(`ik-r-${axis}-num`).value = right[i].toFixed(2);
      document.getElementById(`r-${axis}-val`).textContent = right[i].toFixed(2);
    });
  }
  function setRPYValues(left, right) {
    ['roll','pitch','yaw'].forEach((axis, i) => {
      document.getElementById(`ik-l-${axis}`).value = left[i];
      document.getElementById(`ik-l-${axis}-num`).value = left[i];
      document.getElementById(`l-${axis}-val`).textContent = left[i];
      document.getElementById(`ik-r-${axis}`).value = right[i];
      document.getElementById(`ik-r-${axis}-num`).value = right[i];
      document.getElementById(`r-${axis}-val`).textContent = right[i];
    });
  }
  let ikTimeout;
  function initIKControls() {
    const trigger = () => {
      clearTimeout(ikTimeout);
      ikTimeout = setTimeout(() => {
        const ik = getIKValues(), rpy = getRPYValues();
        apiCall(API.IK, { left_xyz: ik.left, right_xyz: ik.right,
                          left_rpy: rpy.left, right_rpy: rpy.right, duration: 0.5 });
      }, 50);
    };
    ['l','r'].forEach(side => {
      [['x',2],['y',2],['z',2],['roll',0],['pitch',0],['yaw',0]].forEach(([axis, dp]) => {
        const slider = document.getElementById(`ik-${side}-${axis}`);
        const number = document.getElementById(`ik-${side}-${axis}-num`);
        const disp = document.getElementById(`${side}-${axis}-val`);
        const handle = v => {
          const f = parseFloat(v);
          slider.value = v; number.value = f.toFixed(dp);
          disp.textContent = f.toFixed(dp);
          trigger();
        };
        slider.addEventListener('input', e => handle(e.target.value));
        number.addEventListener('input', e => handle(e.target.value));
      });
    });
  }
  async function goHome() {
    const hl = [0.3, 0.2, 0.0], hr = [0.3, -0.2, 0.0], hz = [0, 0, 0];
    setIKValues(hl, hr); setRPYValues(hz, hz);
    await apiCall(API.HOME, {});
  }

  // ==================== 손 제어 (공용) ====================
  async function initHandControls() {
    const info = await apiGet(API.HAND_MOTIONS);
    const statusEl = document.getElementById('hand-status');
    if (info?.left_connected || info?.right_connected) {
      statusEl.textContent = '손: 연결됨'; statusEl.classList.add('connected');
    } else { statusEl.textContent = '손: 미연결'; }
    const motionList = (info?.motions && info.motions.length > 0) ? info.motions
      : ['unfold_a','fold_a','fold_ha','point','handshake','ok','thumbup','victory','rock','promise','grab'];
    const grid = document.getElementById('hand-motions-grid');
    grid.innerHTML = motionList.map(m =>
      `<button class="hand-motion-btn" data-motion="${m}">${m.replace(/_/g,' ')}</button>`).join('');
    grid.addEventListener('click', async e => {
      const btn = e.target.closest('.hand-motion-btn');
      if (!btn) return;
      const motion = btn.dataset.motion;
      if (activeHandMotion === motion) {
        btn.classList.remove('active'); activeHandMotion = null;
        await apiCall(API.HAND, { hand: selectedHand, motion: 'unfold_a', release: false });
      } else {
        grid.querySelectorAll('.hand-motion-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active'); activeHandMotion = motion;
        await apiCall(API.HAND, { hand: selectedHand, motion, release: false });
      }
    });
    document.getElementById('hand-release-btn').addEventListener('click', async () => {
      grid.querySelectorAll('.hand-motion-btn').forEach(b => b.classList.remove('active'));
      activeHandMotion = null;
      await apiCall(API.HAND, { hand: selectedHand, motion: 'unfold_a', release: false });
    });
    const sel = document.getElementById('hand-motion-select');
    sel.innerHTML = '<option value="none">없음</option>';
    motionList.forEach(m => {
      const o = document.createElement('option');
      o.value = m; o.textContent = m.replace(/_/g,' ');
      sel.appendChild(o);
    });
  }
  ['left','both','right'].forEach(h => {
    document.getElementById(`hand-select-${h}`).addEventListener('click', function () {
      selectedHand = h;
      document.querySelectorAll('.hand-selector button').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
    });
  });

  // ==================== 걷기 (공용) ====================
  let locoTimeout;
  function sendLoco(dir) {
    clearTimeout(locoTimeout);
    locoTimeout = setTimeout(() => apiCall(API.LOCO, { direction: dir }), 30);
  }
  document.getElementById('locomotion-controls').addEventListener('mousedown', e => {
    const btn = e.target.closest('.loco-btn');
    if (btn) sendLoco(btn.id.replace('loco-', ''));
  });
  const KEY_MAP = {
    'ArrowUp':'forward','w':'forward','ArrowDown':'backward','s':'backward',
    'ArrowLeft':'turn_left','a':'turn_left','ArrowRight':'turn_right','d':'turn_right',
    'q':'left','e':'right'
  };
  document.addEventListener('keydown', e => {
    if (['INPUT','SELECT'].includes(e.target.tagName)) return;
    if (KEY_MAP[e.key]) sendLoco(KEY_MAP[e.key]);
  });
  document.addEventListener('keyup', e => { if (KEY_MAP[e.key]) sendLoco('stop'); });

  // ==================== 타임라인 (공용, 프레임 혼재) ====================
  function addFrame() {
    const duration = parseFloat(document.getElementById('travel-time-input').value) || 1.0;
    const loco = document.getElementById('locomotion-command-select').value;
    const hand = document.getElementById('hand-motion-select').value;
    const handTarget = document.getElementById('hand-target-select').value;
    const savePose = document.getElementById('save-pose-checkbox').checked;
    if (!savePose && loco === 'none' && hand === 'none') return;
    const frame = { duration };
    if (savePose) {
      if (editorMode === 'joint') {
        frame.pose = { targets: Object.values(G1Joint).map(i => ({
          motor_index: i, target_degree: getMotorValue(i) })) };
      } else {
        const ik = getIKValues(), rpy = getRPYValues();
        frame.left_xyz = ik.left; frame.right_xyz = ik.right;
        frame.left_rpy = rpy.left; frame.right_rpy = rpy.right;
      }
    }
    if (loco !== 'none') frame.locomotion = { direction: loco };
    if (hand !== 'none') frame.hand_motion = { hand: handTarget, motion: hand };
    motionFrames.push(frame);
    renderTimeline();
  }

  function frameType(f) {
    if (f.left_xyz && f.right_xyz) return 'ik';
    if (f.pose) return 'joint';
    return null;
  }
  function frameDetail(f) {
    const t = frameType(f);
    const parts = [];
    if (t === 'ik') {
      parts.push(`L(${f.left_xyz.map(v=>v.toFixed(2)).join(',')}) R(${f.right_xyz.map(v=>v.toFixed(2)).join(',')})`);
    } else if (t === 'joint') {
      const hasWaist = f.pose.targets.some(x => WAIST_INDICES.has(x.motor_index) && x.target_degree !== 0);
      const hasArm = f.pose.targets.some(x => x.motor_index >= 15);
      parts.push([hasArm && '팔', hasWaist && '허리'].filter(Boolean).join('+') || '자세');
    }
    if (f.locomotion) parts.push(f.locomotion.direction);
    if (f.hand_motion) parts.push(`${f.hand_motion.hand}:${f.hand_motion.motion}`);
    return parts.join(' · ') || '-';
  }

  function renderTimeline() {
    const tbody = document.getElementById('timeline-table-body');
    tbody.innerHTML = motionFrames.map((f, i) => {
      const t = frameType(f);
      const badge = t ? `<span class="frame-type ${t}">${t === 'ik' ? 'IK' : 'JNT'}</span>` : '-';
      return `<tr data-index="${i}">
        <td>${i+1}</td><td>${badge}</td>
        <td class="frame-detail">${frameDetail(f)}</td>
        <td>${f.duration.toFixed(1)}s</td>
        <td><button class="delete-frame-btn" data-index="${i}">&times;</button></td></tr>`;
    }).join('');
    tbody.querySelectorAll('tr').forEach(row =>
      row.addEventListener('click', () => loadFrame(parseInt(row.dataset.index))));
    tbody.querySelectorAll('.delete-frame-btn').forEach(btn =>
      btn.addEventListener('click', e => {
        e.stopPropagation();
        motionFrames.splice(parseInt(btn.dataset.index), 1);
        renderTimeline();
      }));
  }

  async function loadFrame(i) {
    const f = motionFrames[i];
    const t = frameType(f);
    if (t === 'joint') {
      setMode('joint');
      await apiCall(API.MOTION, [{ duration: 1.0, pose: f.pose }]);
      f.pose.targets.forEach(x => setMotorValue(x.motor_index, x.target_degree));
    } else if (t === 'ik') {
      setMode('ik');
      setIKValues(f.left_xyz, f.right_xyz);
      setRPYValues(f.left_rpy || [0,0,0], f.right_rpy || [0,0,0]);
      await apiCall(API.IK, { left_xyz: f.left_xyz, right_xyz: f.right_xyz,
        left_rpy: f.left_rpy || [0,0,0], right_rpy: f.right_rpy || [0,0,0], duration: 1.0 });
    }
    if (f?.hand_motion) {
      await apiCall(API.HAND, { hand: f.hand_motion.hand, motion: f.hand_motion.motion, release: false });
    }
  }

  async function playMotion() {
    if (isPlaying || !motionFrames.length) return;
    isPlaying = true; togglePlayUI(false);
    await apiCall(API.MOTION, motionFrames);
    isPlaying = false; togglePlayUI(true);
  }
  async function stopMotion() {
    await apiCall(API.STOP, {});
    isPlaying = false; togglePlayUI(true);
  }
  function togglePlayUI(en) {
    document.getElementById('play-motion-btn').style.display = en ? 'block' : 'none';
    document.getElementById('stop-motion-btn').style.display = en ? 'none' : 'block';
  }
  function saveMotion() {
    const name = prompt('파일 이름:', 'motion');
    if (!name) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(motionFrames, null, 2)], { type: 'application/json' }));
    a.download = `${name}.json`;
    a.click();
  }
  function loadMotion() {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = '.json';
    input.onchange = e => {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = evt => {
        try { motionFrames = JSON.parse(evt.target.result); renderTimeline(); }
        catch { alert('파일 오류'); }
      };
      reader.readAsText(file);
    };
    input.click();
  }

  // ==================== 이벤트 바인딩 ====================
  document.getElementById('reset-all-button').addEventListener('click', stopMotion);
  document.getElementById('home-button').addEventListener('click', goHome);
  document.getElementById('add-frame-btn').addEventListener('click', addFrame);
  document.getElementById('play-motion-btn').addEventListener('click', playMotion);
  document.getElementById('stop-motion-btn').addEventListener('click', stopMotion);
  document.getElementById('save-motion-btn').addEventListener('click', saveMotion);
  document.getElementById('load-motion-btn').addEventListener('click', loadMotion);
  document.getElementById('safe-mode-checkbox').addEventListener('change', toggleSafeMode);

  // ==================== 초기화 ====================
  initJointControls();
  initIKControls();
  initHandControls();
  toggleSafeMode();
  setMode('joint');
});
</script>
</body>
</html>
